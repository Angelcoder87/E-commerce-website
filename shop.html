<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | NovaShop</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <!-- Remix Icons -->

    <link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
          rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/style-extension.css">

    <link rel="stylesheet" href="css/shop.css">

</head>

<body>

    <!--================ HEADER =================-->

    <header>

        <nav class="navbar">

            <div class="logo">

                NovaShop

            </div>

            <ul class="nav-links">

                <li><a href="index.html">Home</a></li>

                <li><a class="active" href="shop.html">Shop</a></li>

                <li><a href="#">Collections</a></li>

                <li><a href="#">Deals</a></li>

                <li><a href="#">Contact</a></li>

            </ul>

            <div class="nav-icons">

                <i id="searchBtn" class="ri-search-line"></i>

                <i id="wishlistBtn" class="ri-heart-3-line"></i>

                <i id="cartBtn" class="ri-shopping-cart-2-line"></i>

                <i class="ri-user-line"></i>

            </div>

        </nav>

    </header>

    <!--================ HERO =================-->

    <section class="shop-hero">

        <div class="shop-hero-content">

            <h1>

                Discover Your Next Favorite Product

            </h1>

            <p>

                Explore premium products carefully selected for quality,
                performance and modern living.

            </p>

        </div>

    </section>

    <!--================ SHOP =================-->

    <section class="shop-container">

        <!-- Sidebar -->

        <aside class="shop-sidebar">

            <h3>Filters</h3>

            <div class="filter-group">

                <h4>Categories</h4>

                <label>

                    <input type="checkbox" value="Fashion">

                    Fashion

                </label>

                <label>

                    <input type="checkbox" value="Electronics">

                    Electronics

                </label>

                <label>

                    <input type="checkbox" value="Shoes">

                    Shoes

                </label>

                <label>

                    <input type="checkbox" value="Accessories">

                    Accessories

                </label>

            </div>

            <div class="filter-group">

                <h4>Price</h4>

                <input
                    id="priceRange"
                    class="price-slider"
                    type="range"
                    min="0"
                    max="1000"
                    value="1000">

                <div class="price-values">

                    <span>$0</span>

                    <span id="priceValue">$1000</span>

                </div>

            </div>

            <div class="filter-group">

                <h4>Rating</h4>

                <label>

                    <input type="radio"
                           name="rating"
                           value="5">

                    ★★★★★

                </label>

                <label>

                    <input type="radio"
                           name="rating"
                           value="4">

                    ★★★★☆

                </label>

                <label>

                    <input type="radio"
                           name="rating"
                           value="3">

                    ★★★☆☆

                </label>

            </div>

        </aside>

        <!-- Main -->

        <main class="shop-content">

            <!-- Toolbar -->

            <div class="shop-toolbar">

                <div class="shop-search">

                    <i class="ri-search-line"></i>

                    <input
                        id="shopSearch"
                        type="text"
                        placeholder="Search products...">

                </div>

                <div class="shop-sort">

                    <select id="sortProducts">

                        <option value="default">

                            Sort Products

                        </option>

                        <option value="low">

                            Price: Low to High

                        </option>

                        <option value="high">

                            Price: High to Low

                        </option>

                        <option value="name">

                            Name (A-Z)

                        </option>

                    </select>

                </div>

            </div>

            <!-- Active Filters -->

            <div class="active-filters">

            </div>

            <!-- Product Grid -->

            <div class="shop-grid">

            </div>

            <!-- Pagination -->

            <div class="pagination">

                <button>

                    <i class="ri-arrow-left-s-line"></i>

                </button>

                <button class="active">

                    1

                </button>

                <button>

                    2

                </button>

                <button>

                    3

                </button>

                <button>

                    <i class="ri-arrow-right-s-line"></i>

                </button>

            </div>

            <!-- Load More -->

            <div class="load-more">

                <button>

                    Load More Products

                </button>

            </div>

        </main>

    </section>

    <!--================ FOOTER =================-->

    <footer>

        <div class="copyright">

            © 2026 NovaShop. All Rights Reserved.

        </div>

    </footer>

    <!--================ JAVASCRIPT =================-->

    <script src="js/products.js"></script>

    <script src="js/cart.js"></script>

    <script src="js/wishlist.js"></script>

    <script src="js/shop.js"></script>

</body>

</html>
